name: Deploy to Vercel

# A integração nativa GitHub App do Vercel não pôde ser autorizada pra esta conta (exige
# login real com 2FA no fluxo OAuth). Em vez de um Deploy Hook — que builda a partir do repo
# *conectado* ao projeto no Vercel, não do repo que disparou o hook, então não refletiria
# commits feitos só aqui — este workflow roda o Vercel CLI direto, deployando exatamente o
# conteúdo deste push. VERCEL_TOKEN é um secret do repositório (Settings > Secrets and
# variables > Actions). VERCEL_ORG_ID/VERCEL_PROJECT_ID não são segredos (são só IDs), então
# ficam fixos aqui.
on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: team_sG5uRTjMG1iSGBRhEnjDCvT6
  VERCEL_PROJECT_ID: prj_d24bxWZFsETcFJYW98jTvEIGYMwx

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy to Vercel (Production)
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
