name: Adicionar variável de ambiente no Vercel

on:
  workflow_dispatch:
    inputs:
      value:
        description: 'Valor da ANTHROPIC_API_KEY_2 (a chave sk-ant-... da conta secundária)'
        required: true
        type: string

env:
  VERCEL_ORG_ID: team_sG5uRTjMG1iSGBRhEnjDCvT6
  VERCEL_PROJECT_ID: prj_d24bxWZFsETcFJYW98jTvEIGYMwx

jobs:
  add-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mascarar o valor nos logs (antes de qualquer outro passo)
        run: echo "::add-mask::${{ inputs.value }}"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # Diagnóstico seguro: só mostra nome/e-mail da conta e dos times que esse token
      # enxerga — nenhum comando aqui imprime o valor do token nem de nenhum segredo.
      # Serve pra descobrir em qual conta/time do Vercel esse token vive, já que
      # `vercel link`/`vercel env` estão falhando com "Could not retrieve Project
      # Settings" mesmo com VERCEL_ORG_ID/VERCEL_PROJECT_ID corretos.
      - name: Diagnóstico — de quem é esse token
        run: |
          echo "== vercel whoami =="
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}" || true
          echo "== vercel teams ls =="
          vercel teams ls --token="${{ secrets.VERCEL_TOKEN }}" || true
          echo "== vercel project ls (sem escopo de org) =="
          vercel project ls --token="${{ secrets.VERCEL_TOKEN }}" || true
      - name: Linkar o projeto (vercel env precisa disso, diferente do vercel deploy)
        run: vercel link --yes --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Remover valor anterior, se existir (pra poder rodar de novo/atualizar)
        run: vercel env rm ANTHROPIC_API_KEY_2 production --yes --token="${{ secrets.VERCEL_TOKEN }}" || true
      - name: Adicionar ANTHROPIC_API_KEY_2 (Production)
        run: echo "${{ inputs.value }}" | vercel env add ANTHROPIC_API_KEY_2 production --token="${{ secrets.VERCEL_TOKEN }}"
